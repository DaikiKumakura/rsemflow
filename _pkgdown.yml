url: https://daikikumakura.github.io/rsemflow/

template:
  bootstrap: 5
  bslib:
    bg: "#ffffff"
    fg: "#252525"
    primary: "#25577b"
    border-color: "#dddddd"
    line-height-base: 1.65
    headings-font-weight: 500

home:
  title: "rsemflow: standard bulk RNA-seq results from RSEM files"
  description: >-
    Expression summaries, PCA, DESeq2, GSEA and GSVA as TSV tables from RSEM
    gene results and a sample table, from the command line or from R, for
    human and mouse.

articles:
  - title: Guides
    navbar: ~
    contents:
      - installation
      - tutorial
      - designs

navbar:
  bg: light
  type: light
  structure:
    left: [start, reference, articles, news, downloads]
    right: [search, github]
  components:
    start:
      text: Get started
      menu:
        - text: Install
          href: "articles/installation.html"
        - text: First example
          href: "articles/rsemflow.html"
    articles:
      text: Articles
      menu:
        - text: Tutorial
          href: articles/tutorial.html
        - text: Designs
          href: articles/designs.html
    downloads:
      text: Downloads
      menu:
        - text: Release
          href: "https://github.com/DaikiKumakura/rsemflow/releases/tag/v0.1.1"
        - text: R-universe
          href: "https://daikikumakura.r-universe.dev/rsemflow"
        - text: Zenodo
          href: "https://doi.org/10.5281/zenodo.24210478"
        - text: Portfolio
          href: "https://daikikumakura.github.io/software/rsemflow.html"

reference:
  - title: "Step 1: Import"
    desc: "Read RSEM files with the sample table, check them, and store the study."
    contents:
      - read_rsem_study
      - read_study
  - title: "Step 2: Summaries"
    desc: "Total counts, detected genes and TPM quantiles per sample and per gene."
    contents:
      - summarize_study
  - title: "Step 3: Sample structure and normalized values"
    desc: "PCA, sample correlation, and VST, normalized counts or log2 TPM."
    contents:
      - compute_pca
      - compute_correlation
      - normalize_expression
  - title: "Step 4: Differential expression"
    desc: "DESeq2 for an explicitly stated design; one table per comparison."
    contents:
      - differential_deseq2
  - title: "Step 5: Pathways"
    desc: "Preranked GSEA and GSVA or ssGSEA scores with MSigDB or your own gene sets."
    contents:
      - run_gsea
      - run_gsva
  - title: "Step 6: Annotation"
    desc: "Gene symbols and descriptions from the GTF or from the OrgDb."
    contents:
      - annotate_gtf
      - annotate_ensembl
  - title: Command line
    desc: "The rsemflow command; every action calls one of the functions above."
    contents:
      - cli_main
  - title: Package
    contents:
      - rsemflow-package
